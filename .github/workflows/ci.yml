name: PostgreSQL tests

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # CI-only credentials for this disposable service; never use production secrets.
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: freight_search_ci
      POSTGRES_USER: freight_search_ci
      POSTGRES_PASSWORD: ci_only_disposable_password
    services:
      postgres:
        image: postgres:18.6-bookworm
        # CI-only initialization values, matching the job's disposable DB settings.
        env:
          POSTGRES_DB: freight_search_ci
          POSTGRES_USER: freight_search_ci
          POSTGRES_PASSWORD: ci_only_disposable_password
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U freight_search_ci -d freight_search_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Check dependency consistency
        run: python -m pip --no-cache-dir check
      - name: Apply schema twice
        env:
          PYTHONPATH: src
        run: |
          python -m freight_search.migrate
          python -m freight_search.migrate
      - name: Run PostgreSQL integration suite
        run: RUN_DB_TESTS=1 python -m pytest -q -W error
